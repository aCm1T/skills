name: Skills CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r CI/requirements.txt
      - name: Validate all skills and tracked files
        run: python CI/validate_skills.py
      - name: Test validators and delivery helper
        run: python -m unittest discover -s CI/tests -v
